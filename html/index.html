<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>App</title>
<style>
  :root {
  --holo-blue: #0a84ff;
  --holo-blue-dark: #006be6;
  --holo-bg: #fff;
  --holo-surface: #ffffff;
  --holo-text: #191c24;
  --holo-secondary: #777e8b;
  --holo-divider: #e6e9ef;
  --holo-control: #f0f2f6;
  --holo-control-top: #ffffff;
  --holo-control-bottom: #e4e8ef;

  --harmony-radius-sm: 10px;
  --harmony-radius-md: 16px;
  --harmony-radius-lg: 22px;
  --harmony-radius-xl: 28px;

  --harmony-ease: cubic-bezier(.2, .8, .2, 1);
  
}

* {
  box-sizing: border-box;
}

html,
body,
#app {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}

html,
body {
  overflow: hidden;
  background: var(--holo-bg);
}

body {
  font-family:
    "HarmonyOS Sans",
    "HarmonyOS Sans SC",
    "Noto Sans JP",
    "Noto Sans",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: var(--holo-text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

#app {
  overflow: hidden;
  background:var(--holo-bg);
}

.baram-view {
  box-sizing: border-box;
  min-width: 0;
  min-height: 0;
  gap: 8px;
}

.baram-linear {
  display: flex;
  min-width: 0;
  min-height: 0;
}

.baram-scroll {
  min-width: 0;
  min-height: 0;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: #c5cbd5 transparent;
}

.baram-relative,
.baram-frame,
.baram-absolute {
  position: relative;
  min-width: 0;
  min-height: 0;
}

.baram-frame > .baram-view {
  position: absolute;
}

.baram-grid {
  display: grid;
  min-width: 0;
  min-height: 0;
}

.baram-table {
  border-collapse: separate;
  border-spacing: 8px;
  width: auto;
  max-width: 100%;
}

.baram-table.stretch-all {
  width: 100%;
  table-layout: fixed;
}

.baram-table td {
  vertical-align: middle;
  padding: 0;
  min-width: 0;
}

.baram-table.stretch-all td > .baram-view {
  width: 100% !important;
  max-width: 100%;
}

.baram-table .table-row {
  height: auto;
}

.baram-space {
  display: block;
}

/* Section typography */

.style-SectionTitle {
  width: 100% !important;
  margin: 28px 0 8px !important;
  padding: 0 !important;
  font-size: 23px !important;
  line-height: 1.35 !important;
  font-weight: 700 !important;
  letter-spacing: -.045em;
  color: var(--holo-text) !important;
}

.style-SectionDescription {
  width: 100% !important;
  margin: 0 0 18px !important;
  padding: 0 !important;
  color: var(--holo-secondary) !important;
  font-size: 13px !important;
  line-height: 1.7 !important;
}

.style-ComponentLabel {
  width: 100% !important;
  margin: 18px 0 8px !important;
  padding: 0 !important;
  color: #505867 !important;
  font-size: 13px !important;
  line-height: 1.5 !important;
  font-weight: 600 !important;
  letter-spacing: .01em;
}

.style-ComponentBox {
  margin-bottom: 5px;
}

/* Text */

.baram-text {
  display: block;
  white-space: pre-wrap;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

/* Buttons */

.baram-button,
.baram-image-button,
.baram-toggle {
  -webkit-appearance: none;
  appearance: none;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 64px;
  min-height: 44px;
  margin: 0;
  padding: 0 20px;
  overflow: hidden;
  border: 1px solid transparent;
  border-radius: var(--harmony-radius-xl);
  outline: none;
  background: var(--holo-control);
  
  color: var(--holo-text);
  font: 500 15px/1.3 inherit;
  text-align: center;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  
}

.baram-button,
.baram-image-button,
.baram-toggle {
  font-family: inherit;
}

.baram-button:hover,
.baram-image-button:hover,
.baram-toggle:hover {
  background: #e7ebf2;
}

.baram-button:active,
.baram-image-button:active,
.baram-toggle:active {
  background: #dce3ee;
}

.baram-button:focus-visible,
.baram-image-button:focus-visible,
.baram-toggle:focus-visible {
  outline: 3px solid rgba(10, 132, 255, .24);
  outline-offset: 2px;
}

.baram-button:disabled,
.baram-image-button:disabled,
.baram-toggle:disabled {
  opacity: .42;
  cursor: not-allowed;
  transform: none;
}

.baram-toggle[data-checked="true"] {
  color: #fff;
  background: var(--holo-blue);
}

.baram-toggle[data-checked="true"]:hover {
  background: var(--holo-blue-dark);
}

/* Inputs */

.baram-edit {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  width: 100%;
  min-width: 80px;
  min-height: 44px;
  margin: 0;
  padding: 10px 14px;
  border: 1px solid transparent;
  border-radius: var(--harmony-radius-md);
  outline: none;
  background: #eceff4;
  color: var(--holo-text);
  font: 400 15px/1.5 inherit;
  
  
}

.baram-edit {
  font-family: inherit;
}

.baram-edit::placeholder {
  color: #9299a6;
  opacity: 1;
}

.baram-edit:hover {
  background: #e7ebf2;
}

.baram-edit:focus {
  background: #fff;
  border-color: rgba(10, 132, 255, .65);
  
}

textarea.baram-edit {
  min-height: 80px;
  resize: vertical;
}

/* Checkbox and radio */

.baram-checkbox,
.baram-radio {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  min-height: 44px;
  padding: 4px 2px;
  color: var(--holo-text);
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

.baram-checkbox .mark,
.baram-radio .mark {
  position: relative;
  flex: 0 0 22px;
  width: 22px;
  height: 22px;
}

.baram-checkbox .mark {
  border: 2px solid #a5acb9;
  border-radius: 7px;
  background: #fff;
  
}

.baram-checkbox[data-checked="true"] .mark {
  border-color: var(--holo-blue);
  background: var(--holo-blue);
}

.baram-checkbox[data-checked="true"] .mark:after {
  content: "";
  position: absolute;
  left: 6px;
  top: 2px;
  width: 5px;
  height: 10px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

.baram-checkbox:focus-visible .mark,
.baram-radio:focus-visible .mark {
  
}

.baram-radio .mark {
  border: 2px solid #a5acb9;
  border-radius: 50%;
  background: #fff;
  
}

.baram-radio[data-checked="true"] .mark {
  border-color: var(--holo-blue);
}

.baram-radio[data-checked="true"] .mark:after {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  background: var(--holo-blue);
}

/* Switch */

.baram-switch {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  min-height: 44px;
  padding: 4px 2px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

.baram-switch .track {
  position: relative;
  flex: 0 0 48px;
  width: 48px;
  height: 28px;
  border: 1px solid #c5cbd5;
  border-radius: 999px;
  background: #e2e6ed;
  
}

.baram-switch .thumb {
  position: absolute;
  left: 3px;
  top: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  
  
}

.baram-switch[data-checked="true"] .track {
  border-color: var(--holo-blue);
  background: var(--holo-blue);
}

.baram-switch[data-checked="true"] .thumb {
  left: 23px;
  background: #fff;
}


.baram-switch:focus-visible .track {
  
}

/* Dropdown */

.baram-spinner {
  -webkit-appearance: none;
  appearance: none;
  min-width: 100px;
  min-height: 44px;
  padding: 9px 38px 9px 14px;
  border: 1px solid transparent;
  border-radius: var(--harmony-radius-md);
  outline: none;
  color: var(--holo-text);
  font: 400 14px/1.5 inherit;
  font-family: inherit;
  background:
    linear-gradient(45deg, transparent 50%, #737c8c 50%)
      calc(100% - 17px) 19px / 6px 6px no-repeat,
    linear-gradient(135deg, #737c8c 50%, transparent 50%)
      calc(100% - 12px) 19px / 6px 6px no-repeat,
    #eceff4;
  cursor: pointer;
  
}

.baram-spinner:hover {
  background-color: #e5eaf1;
}

.baram-spinner:focus {
  background-color: #fff;
  
}

/* Seek bar */

.baram-seek {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  width: 100%;
  height: 36px;
  margin: 0;
  background: transparent;
  outline: none;
  cursor: pointer;
}

.baram-seek::-webkit-slider-runnable-track {
  height: 5px;
  border-radius: 999px;
  background: #dfe4ec;
}

.baram-seek::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  margin-top: -6.5px;
  border: 3px solid #fff;
  border-radius: 50%;
  background: var(--holo-blue);
  
}

.baram-seek::-moz-range-track {
  height: 5px;
  border-radius: 999px;
  background: #dfe4ec;
}

.baram-seek::-moz-range-progress {
  height: 5px;
  border-radius: 999px;
  background: var(--holo-blue);
}

.baram-seek::-moz-range-thumb {
  width: 13px;
  height: 13px;
  border: 3px solid #fff;
  border-radius: 50%;
  background: var(--holo-blue);
  
}

/* Rating */

.baram-rating {
  display: inline-flex;
  gap: 3px;
  align-items: center;
  min-height: 36px;
  width: fit-content;
  font-size: 25px;
  line-height: 1;
  user-select: none;
  cursor: pointer;
}

.baram-rating .star {
  color: #d5dae3;
  
  
}

.baram-rating .star.on {
  color: #ffb547;
  
}

/* Progress */

.baram-progress-horizontal {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  width: 100%;
  height: 6px;
  overflow: hidden;
  border: 0;
  border-radius: 999px;
  background: #e2e6ee;
}

.baram-progress-horizontal::-webkit-progress-bar {
  border-radius: 999px;
  background: #e2e6ee;
}

.baram-progress-horizontal::-webkit-progress-value {
  border-radius: 999px;
  background: var(--holo-blue);
  
}

.baram-progress-horizontal::-moz-progress-bar {
  border-radius: 999px;
  background: var(--holo-blue);
}

.baram-progress-spinner {
  width: 28px;
  height: 28px;
  border: 3px solid #dfe5ef;
  border-top-color: var(--holo-blue);
  border-right-color: var(--holo-blue);
  border-radius: 50%;
  
}



/* Image placeholders */

.baram-image-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 56px;
  min-height: 48px;
  overflow: hidden;
  border: 1px solid #e1e5ed;
  border-radius: var(--harmony-radius-md);
  background:
    linear-gradient(145deg, #f8f9fc, #e7ebf3);
  color: #747e8e;
  font-size: 12px;
}

.camera-icon {
  position: relative;
  display: inline-block;
  width: 24px;
  height: 17px;
  border: 2px solid currentColor;
  border-radius: 5px;
  color: #526071;
}

.camera-icon:before {
  content: "";
  position: absolute;
  left: 5px;
  top: -6px;
  width: 8px;
  height: 5px;
  border: 2px solid currentColor;
  border-bottom: 0;
  border-radius: 3px 3px 0 0;
}

.camera-icon:after {
  content: "";
  position: absolute;
  left: 6px;
  top: 2px;
  width: 7px;
  height: 7px;
  border: 2px solid currentColor;
  border-radius: 50%;
}

/* Lists */

.baram-list,
.baram-expandable {
  overflow: auto;
  border: 1px solid #e9ecf2;
  border-radius: var(--harmony-radius-lg);
  background: var(--holo-surface);
  
}

.baram-list-row {
  display: flex;
  align-items: center;
  min-height: 48px;
  padding: 10px 16px;
  border-bottom: 1px solid #edf0f5;
  color: var(--holo-text);
  
}

.baram-list-row:last-child {
  border-bottom: 0;
}

.baram-list-row:active {
  background: #f0f4fa;
}

.baram-expand-head {
  background: #f5f7fb;
  font-weight: 600;
}

.baram-grid-list {
  display: grid;
  gap: 1px;
  overflow: auto;
  padding: 1px;
  border: 1px solid #e9ecf2;
  border-radius: var(--harmony-radius-lg);
  background: #e9ecf2;
}

.baram-grid-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 56px;
  padding: 8px;
  background: #fff;
  
}

.baram-grid-cell:active {
  background: #edf3ff;
}

/* Search */

.baram-search {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  min-height: 44px;
  padding: 10px 14px 10px 40px;
  border: 1px solid transparent;
  border-radius: var(--harmony-radius-xl);
  outline: none;
  background:
    radial-gradient(
      circle at 20px 19px,
      transparent 0 5px,
      #828b9b 5px 6.5px,
      transparent 7px
    ),
    linear-gradient(
      45deg,
      transparent 47%,
      #828b9b 48% 58%,
      transparent 59%
    ) 26px 25px / 9px 9px no-repeat,
    #eceff4;
  color: var(--holo-text);
  font: 400 14px/1.5 inherit;
  font-family: inherit;
  
}

.baram-search::placeholder {
  color: #8b93a1;
  opacity: 1;
}

.baram-search:focus {
  background-color: #fff;
  
}

/* Number picker */

.baram-number-picker {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  width: fit-content;
  padding: 4px;
  border: 1px solid #e6eaf1;
  border-radius: var(--harmony-radius-xl);
  background: #f1f3f7;
}

.baram-number-picker button {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  background: #fff;
  color: var(--holo-text);
  font: inherit;
  font-size: 20px;
  cursor: pointer;
  
}

.baram-number-picker button:hover {
  background: #e3eafa;
}

.baram-number-picker button:active {
  
}

.baram-number-picker input {
  width: 64px;
  height: 36px;
  border: 0;
  outline: none;
  border-radius: 10px;
  background: transparent;
  color: var(--holo-text);
  font: inherit;
  text-align: center;
}

.baram-number-picker input:focus {
  background: #fff;
}

/* Date and time */

.baram-date,
.baram-time {
  min-height: 44px;
  padding: 9px 12px;
  border: 1px solid transparent;
  border-radius: var(--harmony-radius-md);
  outline: none;
  background: #eceff4;
  color: var(--holo-text);
  font: 400 14px/1.5 inherit;
  font-family: inherit;
  
}

.baram-date:focus,
.baram-time:focus {
  background: #fff;
  
}

/* Embedded content */

.baram-web,
.baram-video {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80px;
  overflow: hidden;
  border: 1px solid #e4e8ef;
  border-radius: var(--harmony-radius-lg);
  background: #f7f8fb;
  color: #7d8695;
}

.baram-video:before {
  content: "▶";
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  margin-right: 10px;
  border-radius: 50%;
  background: var(--holo-blue);
  color: #fff;
  font-size: 14px;
}

/* View flipper */

.baram-viewflipper {
  position: relative;
  overflow: hidden;
  border-radius: var(--harmony-radius-lg);
}

.baram-viewflipper > .baram-view {
  position: absolute !important;
  inset: 0 !important;
  opacity: 0;
  pointer-events: none;
  
  
}

.baram-viewflipper > .baram-view.active {
  opacity: 1;
  pointer-events: auto;
  
}

/* Scrollbar */

.baram-scroll::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}

.baram-scroll::-webkit-scrollbar-track {
  background: transparent;
}

.baram-scroll::-webkit-scrollbar-thumb {
  border-radius: 999px;
  background: #c5cbd5;
}

.baram-scroll::-webkit-scrollbar-thumb:hover {
  background: #aab2c0;
}

/* Runtime error */

.runtime-error {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  padding: 24px;
  border-radius: var(--harmony-radius-lg);
  background: #fff0f0;
  color: #b42332;
  font: 14px/1.6 monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* Motion preferences */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}


/* HarmonyOS-style interaction rules: no shadows, no scale, fade only. */
:root {
  --harmony-ease: linear;
}

*,
*::before,
*::after {
  box-shadow: none !important;
  text-shadow: none !important;
  transition: opacity .1s linear !important;
  animation: none !important;
}

.baram-button,
.baram-image-button,
.baram-toggle,
.baram-number-picker button,
.baram-rating .star,
.baram-viewflipper > .baram-view {
  transform: none !important;
}

.baram-switch .thumb {
  width: 20px !important;
  height: 20px !important;
  top: 3px !important;
}

.baram-switch:active .thumb,
.baram-switch[data-checked="true"]:active .thumb {
  width: 20px !important;
}

.baram-viewflipper > .baram-view {
  transform: none !important;
}

.baram-progress-spinner {
  animation: none !important;
  border-right-color: var(--holo-blue);
}

/* JS-managed scroll viewport and translated content. */
.baram-scroll,
.baram-list,
.baram-expandable,
.baram-grid-list,
.baram-dropdown-menu {
  position: relative;
  overflow: hidden !important;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: auto;
  touch-action: none;
  scrollbar-width: none;
}

.baram-scroll::-webkit-scrollbar,
.baram-list::-webkit-scrollbar,
.baram-expandable::-webkit-scrollbar,
.baram-grid-list::-webkit-scrollbar,
.baram-dropdown-menu::-webkit-scrollbar {
  display: none;
  width: 0;
  height: 0;
}

.baram-js-scroll {
  cursor: grab;
}

.baram-js-scroll.is-dragging {
  cursor: grabbing;
}

.baram-scroll-content {
  position: relative;
  display: block;
  width: 100%;
  min-width: 100%;
  min-height: 100%;
  height: max-content;
  transform: translate3d(0, 0, 0);
  will-change: transform;
}

.baram-scroll[data-scroll-axis="x"] > .baram-scroll-content {
  display: inline-block;
  width: max-content;
  min-width: 100%;
  height: 100%;
  min-height: 100%;
}

.baram-list > .baram-scroll-content,
.baram-expandable > .baram-scroll-content {
  width: 100%;
  min-width: 100%;
}

.baram-grid-list.baram-js-scroll {
  display: block;
}

.baram-grid-list > .baram-scroll-content {
  display: grid;
  grid-template-columns: inherit;
  gap: 1px;
  padding: 1px;
  background: #e9ecf2;
}

.baram-grid-list > .baram-scroll-content > .baram-grid-cell {
  min-width: 0;
}

.baram-scroll-content :is(input, textarea, select, [contenteditable="true"]),
.baram-dropdown-menu :is(input, textarea, select, [contenteditable="true"]) {
  touch-action: auto;
  user-select: text;
}

/* Dropdown popup: its viewport and position are calculated by JavaScript. */
.baram-spinner {
  display: block;
  width: 100%;
  text-align: left;
  cursor: pointer;
}

.baram-dropdown-menu {
  position: fixed;
  z-index: 10000;
  display: block;
  box-sizing: border-box;
  border: 1px solid var(--holo-divider);
  border-radius: var(--harmony-radius-md);
  background: var(--holo-surface);
  color: var(--holo-text);
  opacity: 0;
  pointer-events: none;
  user-select: none;
  cursor: grab;
}

.baram-dropdown-menu.is-open {
  opacity: 1;
  pointer-events: auto;
}

.baram-dropdown-content {
  display: flex;
  flex-direction: column;
  width: 100%;
  min-width: 100%;
  min-height: 0;
  height: max-content;
}

.baram-dropdown-option {
  display: flex;
  align-items: center;

const app=document.getElementById("app");
const a=(n,k)=>n.getAttributeNS?.(ANDROID_NS,k) ?? n.getAttribute?.("baram:"+k) ?? n.getAttribute?.(k);

const idName=v=>(v||"").replace(/^@\+?id\//,"").replace(/^@baram:id\//,"");

const viewState=new WeakMap();

function initViewState(el,initial={}){
  viewState.set(el,{...initial});

}
function getViewState(el){
  if(!viewState.has(el))viewState.set(el,{});

}
function bindActivation(el,fn){
  el.addEventListener("click",ev=>{
    ev.preventDefault();
    ev.stopPropagation();

  el.addEventListener("keydown",ev=>{
    if(ev.key===" "||ev.key==="Enter"){

}
function syncCheckVisual(el){

function setChecked(el,value){
  getViewState(el).checked=!!value;

}
function toggleChecked(el){
  setChecked(el,!getViewState(el).checked);
}
function selectRadio(radio){

    for(const item of group.querySelectorAll(':scope > .baram-radio')){

function dim(v){
  if(v==null||v==="")return null;
  if(v==="match_parent"||v==="fill_parent")return "100%";
  if(v==="wrap_content")return null;
  if(/^[-+]?(?:\d+\.?\d*|\.\d+)(?:dp|dip|sp|px)?$/.test(v))return parseFloat(v)+"px";
  return v;
}
function sideValues(xml,base){
  const all=a(xml,base),h=a(xml,base+"Horizontal"),v=a(xml,base+"Vertical");
  return {
    top:a(xml,base+"Top")??v??all,
    right:a(xml,base+"Right")??a(xml,base+"End")??h??all,
    bottom:a(xml,base+"Bottom")??v??all,
    left:a(xml,base+"Left")??a(xml,base+"Start")??h??all

}
function applySides(el,o,prop){
  const v=[o.top,o.right,o.bottom,o.left].map(x=>dim(x)||"0px");
  if(v.some(x=>x!=="0px"))el.style[prop]=v.join(" ");
}
function textOf(xml){

}
function isContainer(tag){
  return ["LinearLayout","RelativeLayout","FrameLayout","TableLayout","TableRow","GridLayout",
    "AbsoluteLayout","ScrollView","HorizontalScrollView","RadioGroup","ViewFlipper","ViewAnimator",
    "ViewSwitcher","TextSwitcher"].includes(tag);

function applyText(xml,el){
  const size=a(xml,"textSize");if(size)el.style.fontSize=dim(size);
  const color=a(xml,"textColor");if(color&&(/^#/.test(color)||/^rgb/.test(color)))el.style.color=color;
  const style=a(xml,"textStyle")||"";

    el.style.webkitBoxOrient="vertical";

}
function applyGravity(el,g){
  if(!g)return;
  const t=g.split("|");
  if(t.includes("center")||t.includes("center_horizontal"))el.style.textAlign="center";
  if(t.includes("right")||t.includes("end"))el.style.textAlign="right";
  if(t.includes("center")||t.includes("center_vertical")){
    el.style.display="flex";el.style.alignItems="center";
    if(t.includes("center"))el.style.justifyContent="center";
  }
  if(t.includes("bottom")){el.style.display="flex";el.style.alignItems="flex-end"}

function applyCommon(xml,el,parentTag,parentOrientation){
  el.classList.add("baram-view");
  el.dataset.baramTag=xml.tagName;

  const id=a(xml,"id");
  if(id){const k=idName(id);el.dataset.baramId=k;el.id="baram-id-"+k}

  const styleRef=xml.getAttribute("style");
  if(styleRef){
    const k=styleRef.replace(/^@style\//,"").replace(/^\?baram:attr\//,"attr-").replace(/[^\w-]/g,"-");

  const w=a(xml,"layout_width"),h=a(xml,"layout_height");

  if(h==="match_parent"||h==="fill_parent")el.style.height="100%";
  else if(h==="wrap_content")el.style.height="fit-content";

      el.style.flexBasis=(w==="0dp")?"0px":"auto";
      if(w==="0dp"){el.style.width="auto";el.style.minWidth="0"}
    }else{
      el.style.flexGrow=String(weight);el.style.flexShrink="1";
      el.style.flexBasis=(h==="0dp")?"0px":"auto";
      if(h==="0dp"){el.style.height="auto";el.style.minHeight="0"}
    }
  }else{
    if(w==="0dp")el.style.width="0px";
    if(h==="0dp")el.style.height="0px";
  }

  applySides(el,sideValues(xml,"padding"),"padding");
  applySides(el,sideValues(xml,"layout_margin"),"margin");

  const bg=a(xml,"background");
  if(bg&&(/^#/.test(bg)||/^rgba?\(/.test(bg)||/^[a-z]+$/i.test(bg)))el.style.background=bg;

  const alpha=a(xml,"alpha");if(alpha!=null)el.style.opacity=String(alpha);
  const visibility=a(xml,"visibility");
  if(visibility==="gone")el.style.display="none";
  else if(visibility==="invisible")el.style.visibility="hidden";

  const enabled=a(xml,"enabled");
  if(enabled==="false"){
    el.style.opacity=".45";el.style.pointerEvents="none";
    if("disabled" in el)el.disabled=true;
  }

  [["minWidth","minWidth"],["minHeight","minHeight"],["maxWidth","maxWidth"],["maxHeight","maxHeight"]]
    .forEach(([ak,sk])=>{const v=a(xml,ak);if(v)el.style[sk]=dim(v)});

  applyGravity(el,a(xml,"gravity"));

  const layoutGravity=a(xml,"layout_gravity");
  if(layoutGravity&&parentTag==="LinearLayout"){
    const t=layoutGravity.split("|");
    if(parentOrientation==="vertical"){
      if(t.includes("center")||t.includes("center_horizontal"))el.style.alignSelf="center";
      if(t.includes("right")||t.includes("end"))el.style.alignSelf="flex-end";
      if(t.includes("left")||t.includes("start"))el.style.alignSelf="flex-start";
    }else{
      if(t.includes("center")||t.includes("center_vertical"))el.style.alignSelf="center";
      if(t.includes("bottom"))el.style.alignSelf="flex-end";
      if(t.includes("top"))el.style.alignSelf="flex-start";
    }
  }

  if(parentTag==="AbsoluteLayout"){
    el.style.position="absolute";
    el.style.left=dim(a(xml,"layout_x")||"0dp");
    el.style.top=dim(a(xml,"layout_y")||"0dp");
  }

  if(parentTag==="GridLayout"){
    const c=a(xml,"layout_column"),r=a(xml,"layout_row");
    const cs=a(xml,"layout_columnSpan"),rs=a(xml,"layout_rowSpan");
    if(c!=null)el.style.gridColumnStart=String(nnum(c)+1);
    if(r!=null)el.style.gridRowStart=String(nnum(r)+1);
    if(cs!=null)el.style.gridColumnEnd="span "+Math.max(1,nnum(cs,1));
    if(rs!=null)el.style.gridRowEnd="span "+Math.max(1,nnum(rs,1));
  }
}

    case "ImageButton":

    case "CheckBox":{

      const text=document.createElement("span");text.className="control-text";text.textContent=textOf(xml)||"RadioButton";

      initViewState(el,{checked:truth(a(xml,"checked"))});

      break;
    }
    case "Switch":{
      el=document.createElement("div");

      const text=document.createElement("span");text.className="control-text";text.textContent=textOf(xml)||"Switch";

    case "Spinner":{
      el=document.createElement("button");

      el.classList.add("baram-spinner");
      const entries=(a(xml,"entries")||"Item 1|Item 2|Item 3").split("|").map(v=>v.trim()).filter(Boolean);
      el._baramOptions=entries.length?entries:["Item 1","Item 2","Item 3"];
      el.dataset.selectedIndex="0";
      el.textContent=el._baramOptions[0];
      el.setAttribute("aria-haspopup","listbox");
      el.setAttribute("aria-expanded","false");
      el.addEventListener("click",()=>toggleDropdown(el));
      el.addEventListener("keydown",ev=>{
        if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){

          else focusDropdownOption(ev.key==="ArrowDown"?1:-1);
        }

    }
    case "SeekBar":{
      el=document.createElement("input");el.type="range";el.classList.add("baram-seek");

    }
    case "ExpandableListView":{
      el=document.createElement("div");el.classList.add("baram-expandable");
      [["Group 1",1],["Child 1",0],["Child 2",0],["Group 2",1],["Child 1",0]].forEach(([t,h])=>{
        const r=document.createElement("div");r.className="baram-list-row"+(h?" baram-expand-head":"");r.textContent=t;el.append(r)
      });break;
    }
    case "SearchView":
      el=document.createElement("input");el.type="search";el.classList.add("baram-search");el.placeholder=a(xml,"queryHint")||"Search";break;
    case "WebView":

    case "VideoView":

  }

  applyCommon(xml,el,parentTag,parentOrientation);
  layoutRules.set(el,{xml,tag});
  return el;
}

function buildTable(xml,parentTag,parentOrientation){
  const table=document.createElement("table");
  table.classList.add("baram-table","baram-view");
  table.dataset.baramTag="TableLayout";
  layoutRules.set(table,{xml,tag:"TableLayout"});
  if(a(xml,"stretchColumns")==="*")table.classList.add("stretch-all");
  applyCommon(xml,table,parentTag,parentOrientation);

  const tbody=document.createElement("tbody");
  for(const rowXml of Array.from(xml.children)){
    if(rowXml.tagName!=="TableRow")continue;
    const tr=document.createElement("tr");tr.className="table-row";
    const rowH=a(rowXml,"layout_height");if(rowH&&rowH!=="wrap_content")tr.style.height=dim(rowH);
    for(const childXml of Array.from(rowXml.children)){
      const td=document.createElement("td");
      const child=build(childXml,"TableRow","");
      td.append(child);
      tr.append(td);
    }
    tbody.append(tr);
  }
  table.append(tbody);
  return table;
}

function build(xml,parentTag="",parentOrientation=""){
  if(xml.tagName==="TableLayout")return buildTable(xml,parentTag,parentOrientation);

  const el=createControl(xml,parentTag,parentOrientation);
  const tag=xml.tagName;
  const orientation=(tag==="LinearLayout"||tag==="RadioGroup")?(el.dataset.orientation||"vertical"):"";

  if(isContainer(tag)&&tag!=="TableLayout"&&tag!=="TableRow"){
    for(const childXml of Array.from(xml.children)){
      const child=build(childXml,tag,orientation);
      el.append(child);
    }
  }

  if(["ScrollView","HorizontalScrollView","ListView","GridView","ExpandableListView"].includes(tag)){
    const axis=tag==="HorizontalScrollView"?"x":"y";
    makeScrollViewport(el,axis);
  }

  if(tag==="RadioGroup"){
    const radios=Array.from(el.children).filter(x=>x.classList?.contains("baram-radio"));
    let selected=radios.find(x=>getViewState(x).checked);
    if(selected){
      radios.forEach(x=>setChecked(x,x===selected));
    }else{
      radios.forEach(x=>syncCheckVisual(x));
    }
  }

  if(["ViewFlipper","ViewAnimator","ViewSwitcher","TextSwitcher"].includes(tag))initFlipper(xml,el);
  return el;
}

function renderStars(el,count,rating){
  el.innerHTML="";
  for(let i=1;i<=count;i++){
    const s=document.createElement("span");s.className="star"+(i<=Math.round(rating)?" on":"");s.textContent="★";el.append(s);
  }
}
function fillList(el,n){
  for(let i=1;i<=n;i++){const r=document.createElement("div");r.className="baram-list-row";r.textContent="Item "+i;el.append(r)}
}
function startChronometer(el){
  const base=performance.now();
  const tick=()=>{
    if(!el.isConnected)return requestAnimationFrame(tick);
    const sec=Math.floor((performance.now()-base)/1000);
    el.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
    setTimeout(tick,250);
  };tick();
}
function initFlipper(xml,el){
  queueMicrotask(()=>{
    const kids=Array.from(el.children);if(!kids.length)return;
    let i=0;kids[0].classList.add("active");
    if(truth(a(xml,"autoStart"),false)){
      const delay=Math.max(250,nnum(a(xml,"flipInterval"),3000));
      setInterval(()=>{
        if(!el.isConnected)return;
        kids[i].classList.remove("active");i=(i+1)%kids.length;kids[i].classList.add("active");
      },delay);
    }
  });
}
function layoutFrame(xml,el){
  const pr=el.getBoundingClientRect();
  Array.from(xml.children).forEach((cx,i)=>{
    const ch=el.children[i];if(!ch)return;
    const r=ch.getBoundingClientRect();
    const g=(a(cx,"layout_gravity")||"top|left").split("|");
    let x=0,y=0;
    if(g.includes("center")||g.includes("center_horizontal"))x=(pr.width-r.width)/2;
    else if(g.includes("right")||g.includes("end"))x=pr.width-r.width;
    if(g.includes("center")||g.includes("center_vertical"))y=(pr.height-r.height)/2;
    else if(g.includes("bottom"))y=pr.height-r.height;
    ch.style.left=Math.max(0,x)+"px";ch.style.top=Math.max(0,y)+"px";
  });
}
function layoutRelative(xml,el){
  const xmlKids=Array.from(xml.children),htmlKids=Array.from(el.children);
  const ids={};
  htmlKids.forEach(h=>{if(h.dataset.baramId)ids[h.dataset.baramId]=h});
  const pr=el.getBoundingClientRect();

  xmlKids.forEach((cx,i)=>{
    const ch=htmlKids[i];if(!ch)return;
    ch.style.position="absolute";
    const r=ch.getBoundingClientRect();
    const margins=sideValues(cx,"layout_margin");
    const ml=nnum(margins.left),mr=nnum(margins.right),mt=nnum(margins.top),mb=nnum(margins.bottom);
    let x=ml,y=mt;

    if(truth(a(cx,"layout_alignParentRight"))||truth(a(cx,"layout_alignParentEnd")))x=pr.width-r.width-mr;
    if(truth(a(cx,"layout_centerHorizontal"))||truth(a(cx,"layout_centerInParent")))x=(pr.width-r.width)/2;
    if(truth(a(cx,"layout_alignParentBottom")))y=pr.height-r.height-mb;
    if(truth(a(cx,"layout_centerVertical"))||truth(a(cx,"layout_centerInParent")))y=(pr.height-r.height)/2;

    const below=ids[refName(a(cx,"layout_below"))];
    const above=ids[refName(a(cx,"layout_above"))];
    const right=ids[refName(a(cx,"layout_toRightOf")||a(cx,"layout_toEndOf"))];
    const left=ids[refName(a(cx,"layout_toLeftOf")||a(cx,"layout_toStartOf"))];

    if(below){const q=below.getBoundingClientRect();y=q.bottom-pr.top+mt}
    if(above){const q=above.getBoundingClientRect();y=q.top-pr.top-r.height-mb}
    if(right){const q=right.getBoundingClientRect();x=q.right-pr.left+ml}
    if(left){const q=left.getBoundingClientRect();x=q.left-pr.left-r.width-mr}

    const al=ids[refName(a(cx,"layout_alignLeft")||a(cx,"layout_alignStart"))];
    const ar=ids[refName(a(cx,"layout_alignRight")||a(cx,"layout_alignEnd"))];
    const at=ids[refName(a(cx,"layout_alignTop"))];
    const ab=ids[refName(a(cx,"layout_alignBottom"))];
    if(al)x=al.getBoundingClientRect().left-pr.left+ml;
    if(ar)x=ar.getBoundingClientRect().right-pr.left-r.width-mr;
    if(at)y=at.getBoundingClientRect().top-pr.top+mt;
    if(ab)y=ab.getBoundingClientRect().bottom-pr.top-r.height-mb;

    ch.style.left=Math.max(0,x)+"px";ch.style.top=Math.max(0,y)+"px";
  });
}


/* Manual scroll engine: direct offsets, pointer drag, wheel and inertial decay. */
const layoutRules=new WeakMap();
const scrollControllers=new WeakMap();
const liveScrollControllers=new Set();
let activeDropdown=null;
let layoutResizeObserver=null;
let layoutFrameRequest=0;

function makeScrollViewport(el,axis){
  if(el.querySelector(":scope > .baram-scroll-content"))return;
  const content=document.createElement("div");
  content.className="baram-scroll-content";
  while(el.firstChild)content.append(el.firstChild);
  el.append(content);
  el.classList.add("baram-scroll","baram-js-scroll");
  el.dataset.scrollAxis=axis;
  el.style.overflow="hidden";
  if(axis==="x"){
    content.style.display="inline-block";
    content.style.width="max-content";
    content.style.minWidth="100%";
    content.style.height="100%";
  }
  if(el.classList.contains("baram-grid-list")){
    content.style.display="grid";
    content.style.gridTemplateColumns=el.style.gridTemplateColumns;
    content.style.gap="1px";
    content.style.padding="1px";
    content.style.background="#e9ecf2";
  }
}

function setupManualScroll(viewport,content,axis){
  if(scrollControllers.has(viewport))return scrollControllers.get(viewport);
  viewport.classList.add("baram-js-scroll");
  viewport.dataset.scrollAxis=axis;
  viewport.style.overflow="hidden";
  const controller={
    viewport,content,axis,position:0,max:0,velocity:0,raf:0,drag:null,
    suppressNextClick:false,samples:[],destroyed:false,
    extent(){return this.axis==="x"?this.content.scrollWidth:this.content.scrollHeight},
    viewportExtent(){return this.axis==="x"?this.viewport.clientWidth:this.viewport.clientHeight},
    apply(dispatch=true){
      if(this.destroyed)return;
      this.max=Math.max(0,this.extent()-this.viewportExtent());
      const next=Math.max(0,Math.min(this.max,this.position));
      const changed=Math.abs(next-this.position)>.01;
      this.position=next;
      this.content.style.transform=this.axis==="x"
        ?`translate3d(${-this.position}px,0,0)`
        :`translate3d(0,${-this.position}px,0)`;
      if(dispatch){
        this.viewport.dispatchEvent(new CustomEvent("baram:scroll",{bubbles:true,detail:{axis:this.axis,offset:this.position,max:this.max}}));
      }
      return changed;
    },
    setPosition(value,dispatch=true){
      this.position=Number.isFinite(value)?value:0;
      this.apply(dispatch);
    },
    scrollBy(delta){this.setPosition(this.position+delta)},
    refresh(){this.apply(false)},
    stopInertia(){if(this.raf){cancelAnimationFrame(this.raf);this.raf=0}this.velocity=0},
    startInertia(){
      if(this.raf){cancelAnimationFrame(this.raf);this.raf=0}
      if(Math.abs(this.velocity)<.025)return;
      let last=performance.now();
      const tick=now=>{
        if(this.destroyed)return;
        const dt=Math.max(0,Math.min(34,now-last));last=now;
        const wanted=this.position+this.velocity*dt;
        const old=this.position;
        this.setPosition(wanted);
        this.velocity*=Math.exp(-dt/430);
        if(Math.abs(this.velocity)<.025||Math.abs(this.position-old)<.01){this.velocity=0;this.raf=0;return}
        this.raf=requestAnimationFrame(tick);
      };
      this.raf=requestAnimationFrame(tick);
    },
    destroy(){
      this.destroyed=true;
      this.stopInertia();
      this.viewport.removeEventListener("wheel",onWheel);
      this.viewport.removeEventListener("pointerdown",onPointerDown);
      document.removeEventListener("pointermove",onPointerMove);
      document.removeEventListener("pointerup",onPointerUp);
      document.removeEventListener("pointercancel",onPointerCancel);
      this.viewport.removeEventListener("click",onClickCapture,true);
      scrollControllers.delete(this.viewport);
      liveScrollControllers.delete(this);
    }
  };

  function onWheel(ev){
    if(controller.destroyed)return;
    ev.preventDefault();
    let delta=controller.axis==="x"?(ev.deltaX||ev.deltaY):ev.deltaY;
    if(ev.deltaMode===1)delta*=16;
    else if(ev.deltaMode===2)delta*=controller.viewportExtent();
    controller.scrollBy(delta);
  }
  function pointerCoordinate(ev){return controller.axis==="x"?ev.clientX:ev.clientY}
  function onPointerDown(ev){
    if(controller.destroyed||ev.button!==0&&ev.pointerType==="mouse")return;
    if(ev.target.closest("input,textarea,select,[contenteditable='true']"))return;
    if(ev.target.closest(".baram-js-scroll")!==viewport)return;
    controller.stopInertia();
    const now=performance.now();
    controller.drag={id:ev.pointerId,start:pointerCoordinate(ev),startPos:controller.position,lastPos:controller.position,lastTime:now,moved:false};
    controller.samples=[{time:now,position:controller.position}];
  }
  function onPointerMove(ev){
    const d=controller.drag;
    if(!d||d.id!==ev.pointerId)return;
    const coord=pointerCoordinate(ev);
    const delta=coord-d.start;
    if(!d.moved&&Math.abs(delta)>4){d.moved=true;viewport.classList.add("is-dragging")}
    if(!d.moved)return;
    ev.preventDefault();
    controller.position=d.startPos-delta;
    controller.apply();
    const now=performance.now();
    controller.samples.push({time:now,position:controller.position});
    controller.samples=controller.samples.filter(p=>now-p.time<=120);
    d.lastPos=controller.position;d.lastTime=now;
  }
  function endPointer(ev){
    const d=controller.drag;
    if(!d||d.id!==ev.pointerId)return;
    controller.drag=null;
    viewport.classList.remove("is-dragging");
    if(d.moved){
      controller.suppressNextClick=true;
      const points=controller.samples;
      if(points.length>1){
        const first=points[0],last=points[points.length-1];
        const elapsed=Math.max(1,last.time-first.time);
        controller.velocity=Math.max(-2.8,Math.min(2.8,(last.position-first.position)/elapsed));
      }
      controller.startInertia();
    }
    controller.samples=[];
  }
  function onPointerUp(ev){endPointer(ev)}
  function onPointerCancel(ev){
    if(controller.drag&&controller.drag.id===ev.pointerId){controller.drag=null;viewport.classList.remove("is-dragging");controller.samples=[];controller.velocity=0}
  }
  function onClickCapture(ev){
    if(!controller.suppressNextClick)return;
    controller.suppressNextClick=false;
    ev.preventDefault();ev.stopPropagation();
    if(typeof ev.stopImmediatePropagation==="function")ev.stopImmediatePropagation();
  }

  viewport.addEventListener("wheel",onWheel,{passive:false});
  viewport.addEventListener("pointerdown",onPointerDown);
  document.addEventListener("pointermove",onPointerMove,{passive:false});
  document.addEventListener("pointerup",onPointerUp);
  document.addEventListener("pointercancel",onPointerCancel);
  viewport.addEventListener("click",onClickCapture,true);
  scrollControllers.set(viewport,controller);
  liveScrollControllers.add(controller);
  controller.refresh();
  return controller;
}

function initManualScrolls(root=document){
  root.querySelectorAll(".baram-js-scroll").forEach(viewport=>{
    const content=viewport.querySelector(":scope > .baram-scroll-content");
    if(content)setupManualScroll(viewport,content,viewport.dataset.scrollAxis||"y");
  });
}

function clearManualScrolls(){
  for(const controller of Array.from(liveScrollControllers))controller.destroy();
  liveScrollControllers.clear();
}

function refreshLayouts(){
  const nodes=Array.from(app.querySelectorAll(".baram-relative,.baram-frame"));
  for(let pass=0;pass<2;pass++){
    for(const el of nodes){
      const rule=layoutRules.get(el);
      if(!rule)continue;
      if(rule.tag==="RelativeLayout")layoutRelative(rule.xml,el);
      else if(rule.tag==="FrameLayout")layoutFrame(rule.xml,el);
    }
  }
  for(const controller of liveScrollControllers)controller.refresh();
  positionOpenDropdown();
}

function scheduleLayoutRefresh(){
  if(layoutFrameRequest)cancelAnimationFrame(layoutFrameRequest);
  layoutFrameRequest=requestAnimationFrame(()=>{
    layoutFrameRequest=0;
    refreshLayouts();
  });
}

function observeLayout(){
  if(layoutResizeObserver)layoutResizeObserver.disconnect();
  if(typeof ResizeObserver!=="undefined"){
    layoutResizeObserver=new ResizeObserver(()=>scheduleLayoutRefresh());
    layoutResizeObserver.observe(app);
    app.querySelectorAll(".baram-relative,.baram-frame,.baram-js-scroll,.baram-scroll-content").forEach(el=>layoutResizeObserver.observe(el));
  }
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>scheduleLayoutRefresh()).catch(()=>{});
  scheduleLayoutRefresh();
}

/* JS-computed dropdown placement, flipping above when the lower space is insufficient. */
function toggleDropdown(trigger){
  if(activeDropdown&&activeDropdown.trigger===trigger){closeDropdown();return}
  openDropdown(trigger);
}

function openDropdown(trigger){
  closeDropdown(true);
  const options=Array.isArray(trigger._baramOptions)&&trigger._baramOptions.length?trigger._baramOptions:["Item 1","Item 2","Item 3"];
  const menu=document.createElement("div");
  menu.className="baram-dropdown-menu baram-js-scroll";
  menu.dataset.scrollAxis="y";
  menu.setAttribute("role","listbox");
  menu.setAttribute("aria-label",trigger.getAttribute("aria-label")||trigger.textContent||"Options");
  const content=document.createElement("div");
  content.className="baram-dropdown-content baram-scroll-content";
  const selected=Number(trigger.dataset.selectedIndex||0);
  options.forEach((label,index)=>{
    const option=document.createElement("button");
    option.type="button";
    option.className="baram-dropdown-option";
    option.textContent=label;
    option.setAttribute("role","option");
    option.setAttribute("aria-selected",index===selected?"true":"false");
    option.tabIndex=index===selected?0:-1;
    option.addEventListener("click",()=>{
      trigger.dataset.selectedIndex=String(index);
      trigger.textContent=label;
      trigger.setAttribute("aria-expanded","false");
      closeDropdown();
      trigger.focus({preventScroll:true});
    });
    content.append(option);
  });
  menu.append(content);
  document.body.append(menu);
  trigger.setAttribute("aria-expanded","true");
  activeDropdown={trigger,menu,content,options};
  positionOpenDropdown();
  activeDropdown.controller=setupManualScroll(menu,content,"y");
  menu.addEventListener("keydown",ev=>{
    if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){
      ev.preventDefault();focusDropdownOption(ev.key==="ArrowDown"?1:-1);
    }else if(ev.key==="Escape"){
      ev.preventDefault();closeDropdown();trigger.focus({preventScroll:true});
    }
  });
  requestAnimationFrame(()=>{if(activeDropdown&&activeDropdown.menu===menu)menu.classList.add("is-open")});
  const current=content.children[selected];
  if(current)current.focus({preventScroll:true});
}

function focusDropdownOption(direction){
  if(!activeDropdown)return;
  const opts=Array.from(activeDropdown.content.querySelectorAll(".baram-dropdown-option"));
  if(!opts.length)return;
  let idx=opts.indexOf(document.activeElement);
  idx=(idx+direction+opts.length)%opts.length;
  opts.forEach((el,i)=>el.tabIndex=i===idx?0:-1);
  opts[idx].focus({preventScroll:true});
}

function positionOpenDropdown(){
  if(!activeDropdown||!activeDropdown.trigger.isConnected||!activeDropdown.menu.isConnected)return;
  const {trigger,menu,content,controller}=activeDropdown;
  const rect=trigger.getBoundingClientRect();
  const pad=8;
  const viewportWidth=window.innerWidth||document.documentElement.clientWidth;
  const viewportHeight=window.innerHeight||document.documentElement.clientHeight;
  const width=Math.max(1,Math.min(Math.max(rect.width,176),viewportWidth-pad*2));
  const totalHeight=Math.max(44,content.scrollHeight);
  const below=Math.max(0,viewportHeight-rect.bottom-pad-4);
  const above=Math.max(0,rect.top-pad-4);
  const openBelow=below>=Math.min(totalHeight,280)||below>=above;
  const available=openBelow?below:above;
  const height=Math.max(36,Math.min(totalHeight,280,Math.max(36,available),viewportHeight-pad*2));
  const left=Math.max(pad,Math.min(rect.left,viewportWidth-width-pad));
  let top=openBelow?rect.bottom+4:rect.top-height-4;
  top=Math.max(pad,Math.min(top,viewportHeight-height-pad));
  menu.style.width=width+"px";
  menu.style.height=height+"px";
  menu.style.left=left+"px";
  menu.style.top=top+"px";
  if(controller)controller.refresh();
}

function closeDropdown(immediate=false){
  const current=activeDropdown;
  if(!current)return;
  activeDropdown=null;
  current.trigger.setAttribute("aria-expanded","false");
  current.menu.classList.remove("is-open");
  const remove=()=>{
    if(current.controller)current.controller.destroy();
    current.menu.remove();
  };
  if(immediate)remove();
  else setTimeout(remove,100);
}

document.addEventListener("pointerdown",ev=>{
  if(!activeDropdown)return;
  if(activeDropdown.trigger.contains(ev.target)||activeDropdown.menu.contains(ev.target))return;
  closeDropdown();
},true);
document.addEventListener("baram:scroll",()=>positionOpenDropdown());
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&activeDropdown){
    const trigger=activeDropdown.trigger;
    closeDropdown();
    trigger.focus({preventScroll:true});
  }
});
window.addEventListener("resize",()=>scheduleLayoutRefresh());
window.addEventListener("resize",()=>positionOpenDropdown());
window.addEventListener("orientationchange",()=>scheduleLayoutRefresh());

window.BaramScroll=Object.freeze({
  getOffset(element){
    const target=typeof element==="string"?document.querySelector(element):element;
    const controller=target&&scrollControllers.get(target);
    return controller?controller.position:null;
  },
  getMetrics(element){
    const target=typeof element==="string"?document.querySelector(element):element;
    const controller=target&&scrollControllers.get(target);
    return controller?{axis:controller.axis,offset:controller.position,max:controller.max,viewportSize:controller.viewportExtent(),contentSize:controller.extent()}:null;
  },
  scrollTo(element,offset){
    const target=typeof element==="string"?document.querySelector(element):element;
    const controller=target&&scrollControllers.get(target);
    if(!controller)return false;
    controller.stopInertia();controller.setPosition(Number(offset)||0);return true;
  },
  scrollBy(element,delta){
    const target=typeof element==="string"?document.querySelector(element):element;
    const controller=target&&scrollControllers.get(target);
    if(!controller)return false;
    controller.stopInertia();controller.scrollBy(Number(delta)||0);return true;
  },
  refresh(){scheduleLayoutRefresh();return true;}
});

function render(xmlText){
  closeDropdown(true);
  clearManualScrolls();
  if(layoutResizeObserver)layoutResizeObserver.disconnect();
  if(layoutFrameRequest){cancelAnimationFrame(layoutFrameRequest);layoutFrameRequest=0}
  const doc=new DOMParser().parseFromString(xmlText,"application/xml");
  const err=doc.querySelector("parsererror");
  app.innerHTML="";
  if(err){
    const box=document.createElement("div");box.className="runtime-error";box.textContent=err.textContent;app.append(box);return;
  }
  try{
    const ui=build(doc.documentElement);
    app.append(ui);
    // Root Baram match_parent must behave like an app window.
    if(a(doc.documentElement,"layout_width")==="match_parent")ui.style.width="100%";
    if(a(doc.documentElement,"layout_height")==="match_parent")ui.style.height="100%";
    initManualScrolls(app);
    observeLayout();
  }catch(e){
    const box=document.createElement("div");box.className="runtime-error";box.textContent=String(e.stack||e);app.append(box);
  }
}
async function boot(){
  try{
    const r=await fetch("./hi.xml",{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    render(await r.text());
  }catch(_){
    render(SAMPLE_XML);
  }
}
boot();
</script>
