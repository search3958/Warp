
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI Playground</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:sans-serif;background:#fff;color:#000}
body{overflow:hidden}
button,textarea{font:inherit}
.app{width:100%;height:100vh;display:grid;grid-template-rows:44px 1fr}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #ccc}
.title{font-weight:bold}
.spacer{flex:1}
.toolbar{display:flex;gap:6px}
button{border:1px solid #999;background:#fff;color:#000;padding:5px 9px;cursor:pointer}
main{min-height:0;display:grid;grid-template-columns:1fr 1fr}
.editor-side,.preview-side{min-width:0;min-height:0}
.editor-side{display:grid;grid-template-rows:34px 1fr;border-right:1px solid #ccc}
.preview-side{display:grid;grid-template-rows:34px 1fr}
.panel-head{display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #ccc;font-size:12px;font-weight:bold}
.editor-wrap{position:relative;min-height:0}
#xmlEditor{width:100%;height:100%;resize:none;border:0;outline:none;padding:12px;font-family:monospace;font-size:14px;line-height:1.5;white-space:pre;overflow:auto}
.hint{position:absolute;right:8px;bottom:6px;font-size:11px;color:#777;background:#fff}
.preview-wrap{min-height:0;overflow:hidden}
#preview{width:100%;height:100%;border:0;background:#fff;display:block}
@media(max-width:800px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh}
  main{grid-template-columns:1fr;grid-template-rows:500px 600px}
  .editor-side{border-right:0;border-bottom:1px solid #ccc}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">UI Playground</div>
    <div class="spacer"></div>
    <div class="toolbar">
      <button id="resetBtn">Reset</button>
      <button id="runBtn">Run</button>
    </div>
  </header>

  <main>
    <section class="editor-side">
      <div class="panel-head">XML</div>
      <div class="editor-wrap">
        <textarea id="xmlEditor" spellcheck="false"></textarea>
        <div class="hint">⌘ / Ctrl + Enter = Run</div>
      </div>
    </section>

    <section class="preview-side">
      <div class="panel-head">Preview</div>
      <div class="preview-wrap">
        <iframe id="preview" title="UI Preview"></iframe>
      </div>
    </section>
  </main>
</div>

<script>

const RENDERER_CSS = ":root{\n}\n*{box-sizing:border-box}\nhtml,body,#app{width:100%;height:100%;margin:0;padding:0}\nhtml,body{overflow:hidden}\nbody{\n  font-family:Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  font-size:14px;\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n}\n#app{overflow:hidden}\n.baram-view{box-sizing:border-box;min-width:0;min-height:0;gap:8px}\n.baram-linear{display:flex;min-width:0;min-height:0}\n.baram-scroll{\n  min-width:0;min-height:0;\n  overscroll-behavior:contain;\n  -webkit-overflow-scrolling:touch;\n}\n.baram-relative{position:relative;min-width:0;min-height:0}\n.baram-frame{position:relative;min-width:0;min-height:0}\n.baram-frame>.baram-view{position:absolute}\n.baram-absolute{position:relative;min-width:0;min-height:0}\n.baram-grid{display:grid;min-width:0;min-height:0}\n.baram-table{\n  border-collapse:separate;\n  border-spacing:6px 6px;\n  width:auto;\n  max-width:100%;\n}\n.baram-table.stretch-all{width:100%;table-layout:fixed}\n.baram-table td{\n  vertical-align:middle;\n  padding:0;\n  min-width:0;\n}\n.baram-table.stretch-all td>.baram-view{\n  width:100%!important;\n  max-width:100%;\n}\n.baram-table .table-row{height:auto}\n.baram-space{display:block}\n\n/* Styles referenced by the supplied XML */\n.style-SectionTitle{\n  width:100%!important;\n  margin:22px 0 8px 0!important;\n  padding:0!important;\n  font-size:24px!important;\n  line-height:30px!important;\n  font-weight:700!important;\n}\n.style-SectionDescription{\n  width:100%!important;\n  margin:0 0 14px 0!important;\n  padding:0!important;\n  font-size:13px!important;\n  line-height:18px!important;\n}\n.style-ComponentLabel{\n  width:100%!important;\n  margin:14px 0 6px 0!important;\n  padding:0!important;\n  font-size:15px!important;\n  line-height:20px!important;\n}\n.style-ComponentBox{\n  margin-bottom:3px;\n}\n\n/* Baram 4 / Holo-ish primitives */\n.baram-text{\n  display:block;\n  white-space:pre-wrap;\n  line-height:1.25;\n n      break;\n  }\n\n  applyCommon(xml,el,parentTag,parentOrientation);\n  return el;\n}\n\nfunction buildTable(xml,parentTag,parentOrientation){\n  const table=document.createElement(\"table\");\n  table.classList.add(\"baram-table\",\"baram-view\");\n  table.dataset.baramTag=\"TableLayout\";\n  if(a(xml,\"stretchColumns\")===\"*\")table.classList.add(\"stretch-all\");\n  applyCommon(xml,table,parentTag,parentOrientation);\n\n  const tbody=document.createElement(\"tbody\");\n  for(const rowXml of Array.from(xml.children)){\n    if(rowXml.tagName!==\"TableRow\")continue;\n    const tr=document.createElement(\"tr\");tr.className=\"table-row\";\n    const rowH=a(rowXml,\"layout_height\");if(rowH&&rowH!==\"wrap_content\")tr.style.height=dim(rowH);\n    for(const childXml of Array.from(rowXml.children)){\n      const td=document.createElement(\"td\");\n      const child=build(childXml,\"TableRow\",\"\");\n      td.append(child);\n      tr.append(td);\n    }\n    tbody.append(tr);\n  }\n  table.append(tbody);\n  return table;\n}\n\nfunction build(xml,parentTag=\"\",parentOrientation=\"\"){\n  if(xml.tagName===\"TableLayout\")return buildTable(xml,parentTag,parentOrientation);\n\n  const el=createControl(xml,parentTag,parentOrientation);\n  const tag=xml.tagName;\n  const orientation=(tag===\"LinearLayout\"||tag===\"RadioGroup\")?(el.dataset.orientation||\"vertical\"):\"\";\n\n  if(isContainer(tag)&&tag!==\"TableLayout\"&&tag!==\"TableRow\"){\n    for(const childXml of Array.from(xml.children)){\n      const child=build(childXml,tag,orientation);\n      el.append(child);\n    }\n  }\n\n  if(tag===\"RadioGroup\"){\n    const radios=Array.from(el.children).filter(x=>x.classList?.contains(\"baram-radio\"));\n    let selected=radios.find(x=>getViewState(x).checked);\n    if(selected){\n      radios.forEach(x=>setChecked(x,x===selected));\n    }else{\n      radios.forEach(x=>syncCheckVisual(x));\n    }\n  }\n\n  if(tag===\"RelativeLayout\")queueMicrotask(()=>layoutRelative(xm function preparePreview() {
  const doc = preview.contentDocument;

  doc.write("\<!doctype html>\<html lang=\"ja\"\>\<head\>\<meta charset=\"utf-8\"\>\<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no\"\>\<\/head\>\<body\>\<div id=\"app\"\>\<\/div\>\<\/body\>\<\/html\>");

  doc.head.appendChild(style);

  const runtime = doc.createElement("script");
  runtime.textContent = RENDERER_JS;
  doc.body.appendChild(runtime);
}

function run() {
  preparePreview();

  const render = preview.contentWindow.__w4uRender;
  if (typeof render !== "function") {
    throw new Error("UI renderer failed to initialize.");
  }

  render(xmlEditor.value);
}

document.getElementById("runBtn").addEventListener("click", () => {
  try {
    run();
  } catch (error) {
    console.error(error);
  }
});

document.getElementById("resetBtn").addEventListener("click", () => {

});

xmlEditor.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
    e.preventDefault();
    run();
  }

  if (e.key === "Tab") {
    e.preventDefault();

    const start = xmlEditor.selectionStart;
    const end = xmlEditor.selectionEnd;

    xmlEditor.value =
      xmlEditor.value.slice(0, start) +
      "    " +
      xmlEditor.value.slice(end);

    xmlEditor.selectionStart = xmlEditor.selectionEnd = start + 4;

});
