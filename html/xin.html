<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warp Language Engine Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/beercss@3.5.1/dist/cdn/beer.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.5.1/dist/cdn/beer.min.js"></script>
    <style>
        body { padding: 1rem; background-color: var(--background); color: var(--on-background); }
        .warp-card { margin-bottom: 1rem; padding: 1rem; border-radius: 12px; }
        .warp-hstack { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
        .warp-vstack { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
        .debug-hidden { display: none; }
    </style>
</head>
<body class="dark">

<main id="app"></main>

<script>
/**
 * Warp Engine (雰囲気実装)
 * .warp ファイルをフェッチし、JSで実行可能な関数に変換してMaterial 3 UIを構築します。
 */
class WarpEngine {
    constructor(rootId) {
        this.root = document.getElementById(rootId);
        this.screens = {};
        this.containers = {}; // id指定された要素の管理用
        
        // リアクティブな状態管理 (変数が更新されると自動で再描画)
        this.state = new Proxy({}, {
            set: (target, property, value) => {
                target[property] = value;
                // 状態が変わったら現在の画面を再レンダリング (簡易的な仮想DOM風)
                if (this.isReady) {
                    requestAnimationFrame(() => this.renderScreen(target.currentScreen));
                }
                return true;
            }
        });
        
        this.isReady = false;
        this.currentParent = this.root;
    }

    async load(url) {
        const res = await fetch(url);
        const code = await res.text();
        this.parse(code);
    }

    parse(code) {
        let jsCode = code;

        // 1. コメント削除
        jsCode = jsCode.replace(/\/\/.*$/gm, '');

        // 2. 変数宣言の変換
        jsCode = jsCode.replace(/@App var (\w+) = (.*)/g, 'state.$1 = $2;');
        jsCode = jsCode.replace(/@State var (\w+) = (.*)/g, 'if (state.$1 === undefined) state.$1 = $2;');
        jsCode = jsCode.replace(/@Storage var (\w+) = (.*)/g, 'if (state.$1 === undefined) state.$1 = $2;');

        // 3. 文字列展開 \(var) -> ${var} (バッククォート内での利用を想定)
        jsCode = jsCode.replace(/\\\((.*?)\)/g, '${$1}');

        // 4. コンポーネントの変換 (複数行対応のために [^]*? を使用)
        // Screen block
        jsCode = jsCode.replace(/Screen\s+(\w+)\s*\{([^]*?)\n\}/g, 'w.registerScreen("$1", () => { $2 \n});');
        
        // Header, Card, HStack, VStack (引数あり・なし両対応)
        jsCode = jsCode.replace(/Header\("(.*?)"\)\s*\{([^]*?)\n\s*\}/g, 'w.Header(`$1`, () => { $2 \n});');
        jsCode = jsCode.replace(/Card\("(.*?)"\)\s*\{([^]*?)\n\s*\}/g, 'w.Card(`$1`, () => { $2 \n});');
        jsCode = jsCode.replace(/HStack\s*\{([^]*?)\n\s*\}/g, 'w.HStack(() => { $2 \n});');
        jsCode = jsCode.replace(/VStack\s*\{([^]*?)\n\s*\}/g, 'w.VStack(() => { $2 \n});');

        // Button / TonalButton
        jsCode = jsCode.replace(/TonalButton\("(.*?)"\)\s*\{([^]*?)\}/g, 'w.TonalButton(`$1`, () => { $2 })');
        jsCode = jsCode.replace(/Button\("(.*?)"\)\s*\{([^]*?)\}/g, 'w.Button(`$1`, () => { $2 })');

        // 5. UIパーツ (Toggle, Slider, TextField)
        jsCode = jsCode.replace(/Toggle\(isOn:\s*\$(\w+)\)/g, 'w.Toggle("$1")');
        jsCode = jsCode.replace(/Slider\(value:\s*\$(\w+),\s*in:\s*(.*?),\s*step:\s*(.*?)\)/g, 'w.Slider("$1", "$2", $3)');
        jsCode = jsCode.replace(/TextField\("(.*?)",\s*text:\s*\$(\w+)\)/g, 'w.TextField(`$1`, "$2")');
        jsCode = jsCode.replace(/Text\("(.*?)"\)/g, 'w.Text(`$1`)');

        // 6. モディファイア (メソッドチェーン)
        jsCode = jsCode.replace(/\.frame\((.*?)\)/g, '.frame(`$1`)');
        jsCode = jsCode.replace(/\.id\("(.*?)"\)/g, '.setId(`$1`)');
        jsCode = jsCode.replace(/\.disabled\((.*?)\)/g, '.setDisabled($1)');
        jsCode = jsCode.replace(/\.hidden\((.*?)\)/g, '.setHidden($1)');

        // 7. 関数変換
        jsCode = jsCode.replace(/func\s+(\w+)\(\)\s*\{([^]*?)\n\}/g, 'w.registerFunc("$1", () => { $2 \n});');

        console.log("Transpiled JS:", jsCode); // デバッグ用に変換後のコードを表示

        const w = this.createUIBuilder();
        const state = this.state;
        const evaluate = (expr) => {
            try { return eval(expr); } catch(e) { return 0; }
        };
        const reset = () => { location.reload(); };
        const wait = (sec) => { return new Promise(r => setTimeout(r, sec * 1000)); };
        
        try {
            const runner = new Function('w', 'state', 'evaluate', 'reset', 'wait', `
                with(state) {
                    ${jsCode}
                }
            `);
            runner(w, state, evaluate, reset, wait);
            this.isReady = true;
            this.renderScreen(state.currentScreen);
        } catch(e) {
            console.error("Runtime Error:", e);
        }
    }

    renderScreen(screenName) {
        if (!this.screens[screenName]) return;
        this.root.innerHTML = '';
        this.currentParent = this.root;
        this.containers = {}; // リセット
        
        // 描画関数を実行（Stateがバインドされた状態でUIが構築される）
        const w = this.createUIBuilder();
        const state = this.state;
        const runner = new Function('w', 'state', `
            with(state) {
                w.screens["${screenName}"]();
            }
        `);
        runner(w, state);
    }

    // UIコンポーネントをDOMにマッピングするビルダー
    createUIBuilder() {
        const engine = this;
        
        class UIElement {
            constructor(el) { this.el = el; }
            setId(id) { 
                this.el.id = id; 
                engine.containers[id] = this.el;
                return this; 
            }
            setDisabled(isDisabled) { this.el.disabled = isDisabled; return this; }
            setHidden(isHidden) { 
                if(isHidden) this.el.classList.add("debug-hidden"); 
                else this.el.classList.remove("debug-hidden");
                return this; 
            }
            // 簡易モディファイア（今回はチェインだけできるようにダミー実装含む）
            frame() { return this; }
            position() { return this; }
            zIndex() { return this; }
            status() { return this; }
            backgroundColor() { return this; }
            foregroundColor() { return this; }
            offset() { return this; }
            width() { return this; }
            onLongPress() { return this; }
        }

        const append = (el) => {
            engine.currentParent.appendChild(el);
            return new UIElement(el);
        };

        const wrapBlock = (el, block) => {
            const prevParent = engine.currentParent;
            engine.currentParent = el;
            block();
            engine.currentParent = prevParent;
            return new UIElement(el);
        };

        return {
            screens: engine.screens,
            registerScreen: (name, block) => { engine.screens[name] = block; },
            registerFunc: (name, block) => { window[name] = block; }, // 今回はグローバルに逃がす
            
            Text: (text) => {
                const el = document.createElement('div');
                el.textContent = text;
                return append(el);
            },
            Button: (label, action) => {
                const btn = document.createElement('button');
                btn.className = 'button';
                btn.textContent = label;
                btn.onclick = action;
                return append(btn);
            },
            TonalButton: (label, action) => {
                const btn = document.createElement('button');
                btn.className = 'button secondary'; // M3のTonal風
                btn.textContent = label;
                btn.onclick = action;
                return append(btn);
            },
            Card: (title, block) => {
                const article = document.createElement('article');
                article.className = 'warp-card border';
                const h5 = document.createElement('h5');
                h5.textContent = title;
                article.appendChild(h5);
                append(article);
                return wrapBlock(article, block);
            },
            Header: (title, block) => {
                const nav = document.createElement('nav');
                nav.className = 'top';
                const h6 = document.createElement('h6');
                h6.textContent = title;
                nav.appendChild(h6);
                append(nav);
                // Header内の要素（ボタン等）を追加
                if(block) wrapBlock(nav, block);
                return new UIElement(nav);
            },
            HStack: (block) => {
                const div = document.createElement('div');
                div.className = 'warp-hstack';
                append(div);
                return wrapBlock(div, block);
            },
            VStack: (block) => {
                const div = document.createElement('div');
                div.className = 'warp-vstack';
                append(div);
                return wrapBlock(div, block);
            },
            Toggle: (stateKey) => {
                const label = document.createElement('label');
                label.className = 'switch';
                const input = document.createElement('input');
                input.type = 'checkbox';
                input.checked = engine.state[stateKey];
                input.onchange = (e) => { engine.state[stateKey] = e.target.checked; };
                const span = document.createElement('span');
                label.appendChild(input);
                label.appendChild(span);
                return append(label);
            },
            Slider: (stateKey, rangeStr, step) => {
                const input = document.createElement('input');
                input.type = 'range';
                input.className = 'slider';
                input.value = engine.state[stateKey];
                input.oninput = (e) => { engine.state[stateKey] = e.target.value; };
                return append(input);
            },
            TextField: (placeholder, stateKey) => {
                const field = document.createElement('div');
                field.className = 'field label border';
                const input = document.createElement('input');
                input.type = 'text';
                input.value = engine.state[stateKey];
                input.oninput = (e) => { engine.state[stateKey] = e.target.value; };
                const label = document.createElement('label');
                label.textContent = placeholder;
                field.appendChild(input);
                field.appendChild(label);
                return append(field);
            }
        };
    }
}

// 初期化と起動
const engine = new WarpEngine('app');
engine.load('./demo.warp').catch(err => {
    document.getElementById('app').innerHTML = `<p style="color:red;">Error: ${err.message}<br>※VS CodeのLive Serverなど、HTTPサーバー経由で開いているか確認してください。</p>`;
});

// コンテナ操作用のグローバル関数 (ctrl() から呼ばれる想定)
window.container = (id) => {
    return {
        add: () => console.log(`${id} に追加 (未実装)`),
        removeLast: () => console.log(`${id} から削除 (未実装)`),
        clear: () => console.log(`${id} をクリア (未実装)`)
    };
};
</script>

</body>
</html>
